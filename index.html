const liked=new Set(JSON.parse(localStorage.getItem('home-hunt-liked')||'[]')); let filter='all';
const groups=[['Condo','Top 15 condos'],['Single-family','Top 15 single-family homes'],['Townhouse / attached','Top 15 townhouses / attached homes']];
const money=v=>v==null?'Unknown':'$'+Math.round(v).toLocaleString();
const mode=a=>{const m={};a.forEach(x=>m[x]=(m[x]||0)+1);return Object.entries(m).sort((a,b)=>b[1]-a[1])[0]?.[0]||'Mixed'};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function pass(h){if(filter==='all')return true;if(filter==='newer')return h.year>=2000;if(filter==='schools')return h.school>=4;if(filter==='liked')return liked.has(h.id);return h.category===filter}
function card(h,i){return `<article class="home" id="${h.id}"><div class="rank">${i+1}</div>${h.year>=2000?'<div class="newer">2000+</div>':''}<div class="top"><div><h3>${h.name}</h3><p>${h.area}</p></div><div class="score">${h.score}<span>/100</span></div></div><div class="price">${money(h.price)}<span>${h.sqft?h.sqft.toLocaleString()+' sf':'Size unknown'}</span></div><div class="facts"><div><b>${h.beds} / ${h.baths}</b><span>beds / baths</span></div><div><b>${h.year||'Verify'}</b><span>built</span></div><div><b>${h.hoa==null?'N/A':money(h.hoa)}</b><span>HOA / mo</span></div><div><b>${h.tax==null?'Unknown':money(h.tax)}</b><span>tax / mo</span></div></div><div class="commute"><div><small>🚉 nearest rail</small><b>${h.station}</b><span>≈ ${h.station_mi.toFixed(2)} mi</span></div><div><small>🏙 city</small><b>${h.city}</b><span>≈ ${h.city_min} min rail</span></div></div><div class="quality">✨ ${h.quality}</div><div class="school">🎓 School fit ${h.school.toFixed(1)}/5</div><div class="actions"><button class="${liked.has(h.id)?'liked':''}" data-like="${h.id}">${liked.has(h.id)?'♥ Liked':'♡ Like'}</button><a href="${h.url}" target="_blank" rel="noopener">Open listing</a></div></article>`}
function render(){let html='';groups.forEach(([cat,title])=>{const xs=HOMES.filter(h=>h.category===cat&&pass(h));if(xs.length)html+=`<section class="section"><h2>${title}</h2><p>${xs.length} shown</p><div class="cards">${xs.map(card).join('')}</div></section>`});document.getElementById('content').innerHTML=html;document.querySelectorAll('[data-like]').forEach(b=>b.onclick=()=>{liked.has(b.dataset.like)?liked.delete(b.dataset.like):liked.add(b.dataset.like);localStorage.setItem('home-hunt-liked',JSON.stringify([...liked]));render();taste()});taste()}
function taste(){const xs=HOMES.filter(h=>liked.has(h.id));document.getElementById('likedCount').textContent=xs.length;if(!xs.length){document.getElementById('traits').innerHTML='';document.getElementById('similar').innerHTML='';document.getElementById('hint').textContent='Like 2–3 homes and the site will show what they have in common.';return}const p={category:mode(xs.map(h=>h.category)),price:avg(xs.map(h=>h.price)),sqft:avg(xs.map(h=>h.sqft).filter(Boolean)),school:avg(xs.map(h=>h.school)),city:avg(xs.map(h=>h.city_min)),station:avg(xs.map(h=>h.station_mi))};document.getElementById('hint').textContent=xs.length<2?'Like one or two more and the pattern will get clearer.':'Here is the pattern across the homes you like.';document.getElementById('traits').innerHTML=[['Type',p.category],['Typical price','$'+Math.round(p.price/1000)+'k'],['Typical size',p.sqft?Math.round(p.sqft).toLocaleString()+' sf':'—'],['School fit',p.school.toFixed(1)+'/5'],['City commute','~'+Math.round(p.city)+' min'],['Station','~'+p.station.toFixed(2)+' mi']].map(([k,v])=>`<div class="trait"><b>${v}</b><span>${k}</span></div>`).join('');if(xs.length<2){document.getElementById('similar').innerHTML='';return}const cand=HOMES.filter(h=>!liked.has(h.id)).map(h=>{let s=0;s+=h.category===p.category?30:5;s+=Math.max(0,25-Math.abs(h.price-p.price)/16000);if(h.sqft&&p.sqft)s+=Math.max(0,20-Math.abs(h.sqft-p.sqft)/65);s+=Math.max(0,15-Math.abs(h.school-p.school)*8);s+=Math.max(0,10-Math.abs(h.city_min-p.city)/4);return[h,s]}).sort((a,b)=>b[1]-a[1]).slice(0,6);document.getElementById('similar').innerHTML=cand.map(([h,s])=>`<div class="sim"><b>${h.name}</b><span>${h.area}</span><span>${Math.round(s)}% taste match</span><a href="#${h.id}">Jump to home</a></div>`).join('')}
document.querySelectorAll('#filters .chip').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('#filters .chip').forEach(x=>x.classList.toggle('on',x===b));render()});
document.getElementById('similar').addEventListener('click',event=>{
  const link=event.target.closest('a[href^="#"]');
  if(!link)return;
  const id=link.getAttribute('href').slice(1);
  if(!HOMES.some(h=>h.id===id))return;
  if(!document.getElementById(id)){
    filter='all';
    document.querySelectorAll('#filters .chip').forEach(b=>b.classList.toggle('on',b.dataset.f==='all'));
    render();
  }
  event.preventDefault();
  history.replaceState(null,'','#'+id);
  document.getElementById(id).scrollIntoView({block:'center'});
});
render();
</script></main></body></html>
