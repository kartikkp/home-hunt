name: home-hunt
services:
  dynamodb:
    image: amazon/dynamodb-local@sha256:d89f8fcc6b1a39cb35976c248ed42a28c66ae00dc043099210f5571e42648ab4
    user: root
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
    volumes: ["dynamodb-data:/data"]
    networks: [backend]
    restart: unless-stopped
    mem_limit: 512m
    logging: {driver: json-file, options: {max-size: "5m", max-file: "2"}}
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: home-hunt-api:local
    container_name: home-hunt-api
    env_file: .env
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_TABLE: HomeHunt
      ALLOWED_ORIGINS: https://kartikkp.github.io
    networks: [backend, edge]
    depends_on: [dynamodb]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: {driver: json-file, options: {max-size: "5m", max-file: "2"}}
  backup:
    image: home-hunt-api:local
    command: ["node", "backup.mjs"]
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_TABLE: HomeHunt
    volumes: ["./backups:/backups"]
    networks: [backend]
    depends_on: [api]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    logging: {driver: json-file, options: {max-size: "5m", max-file: "2"}}
networks:
  backend:
    internal: true
  edge:
    external: true
    name: wedding-budget-edge
volumes:
  dynamodb-data:
